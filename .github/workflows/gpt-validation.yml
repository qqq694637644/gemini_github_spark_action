name: Gemini Spark MCP Gateway Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and local Git integration tests
        run: pytest -q
      - name: Validate MCP tool surface
        run: python scripts/validate_mcp.py
      - name: Validate public OpenAPI surface
        run: python scripts/export_openapi.py
        env:
          PUBLIC_BASE_URL: https://gateway.example.com
