name: Remote Gemini Spark MCP Validation

on:
  workflow_dispatch:
    inputs:
      mcp_server_url:
        description: HTTPS MCP endpoint, for example https://gateway.example.com/mcp
        required: true
        type: string
      test_owner:
        description: Optional GitHub owner for read-only end-to-end tool validation
        required: false
        type: string
      test_repo:
        description: Optional GitHub repository for read-only end-to-end tool validation
        required: false
        type: string
      test_ref:
        description: Git ref used by the read-only validation flow
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Validate deployed MCP endpoint
        env:
          MCP_SERVER_URL: ${{ inputs.mcp_server_url }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCEPTANCE_ACCESS_TOKEN }}
          MCP_TEST_OWNER: ${{ inputs.test_owner }}
          MCP_TEST_REPO: ${{ inputs.test_repo }}
          MCP_TEST_REF: ${{ inputs.test_ref }}
        run: python scripts/validate_remote_mcp.py
